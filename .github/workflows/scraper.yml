name: Run Pappers Scraper and Update CSV

on:
  schedule:
    - cron: '0 0 * * *' # Tous les jours à minuit
  workflow_dispatch: # Lancement manuel en 1 clic

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # ÉTAPE INDISPENSABLE POUR PLAYWRIGHT
    - name: Install Playwright Browsers & System Dependencies
      run: |
        python -m playwright install --with-deps chromium

    - name: Run Scraper
      run: python mon_script.py # Remplacer par le nom exact de votre script .py

    - name: Commit and Push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add *.csv
        git diff-index --quiet HEAD || (git commit -m "Auto-update Pappers CSV: $(date +'%Y-%m-%d %H:%M')" && git push)
